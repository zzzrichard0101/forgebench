[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgebench"
version = "0.1.0"
description = "A reproducible harness laboratory for long-horizon engineering agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
portfolio = ["reportlab>=5,<6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
